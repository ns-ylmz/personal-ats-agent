name: CI

# Server-side counterpart of the local .ai/hooks/ guardrails. Local hooks
# guide the agent during the session; this workflow is the enforcement the
# team can rely on, since local hooks can be bypassed.
#
# Stack-agnostic by design. Adjust this workflow to include the lint,
# typecheck, test, and build steps relevant to your tech stack.

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Placeholder CI Step
        run: echo "Configure your CI verification steps here (lint, test, build)"

  pr-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same rule as .ai/hooks/guard-pr-body.sh, enforced server-side:
      # the PR body must contain every ## section from the template.
      - name: Check PR body against pull_request_template.md
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          TEMPLATE=".github/pull_request_template.md"
          [ -f "$TEMPLATE" ] || { echo "no PR template - skipping"; exit 0; }
          MISSING=""
          while IFS= read -r header; do
            [ -z "$header" ] && continue
            echo "$PR_BODY" | grep -qiF "## ${header}" || MISSING="${MISSING}\"${header}\" "
          done <<< "$(grep -E '^##[[:space:]]+' "$TEMPLATE" | sed -E 's/^##[[:space:]]+//')"
          if [ -n "$MISSING" ]; then
            echo "::error::PR body is missing required section(s): ${MISSING}"
            exit 1
          fi
